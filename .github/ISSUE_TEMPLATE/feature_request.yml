name: Feature request
description: Suggest a Console UI, Tauri bridge, operations, or documentation improvement
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Daemon, API contract, or SDK-only changes belong in the corresponding MycelDB repository first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI/navigation
        - Authentication/session
        - Spaces/domains/schema
        - Graph/query
        - Semantic/inference/automation
        - Backup/restore/import/export
        - Activity/audit views
        - Raft/cluster reliability
        - Tauri command bridge
        - Packaging/release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Mycel Console provide or change?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and operations impact
      description: Would this affect auth, tokens, Tauri permissions, filesystem access, raft/clustering, backup/restore, import/export, or destructive operator actions?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Would this affect UI behavior, Tauri commands, configuration, packaging, daemon/API/SDK version compatibility, or existing deployments?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workaround or lower-risk approach.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
