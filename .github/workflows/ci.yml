name: CI

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MYCEL_RUST_SDK_REF: 33c7e643b679111398dcaf8a340572cc3cce56f5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Console
        uses: actions/checkout@v4
        with:
          path: mycel-console

      - name: Checkout Rust SDK at pinned release revision
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-rust-sdk
          ref: ${{ env.MYCEL_RUST_SDK_REF }}
          path: mycel-rust-sdk

      - name: Install Tauri Linux dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mycel-console/package-lock.json

      - name: Install frontend dependencies
        working-directory: mycel-console
        run: npm ci

      - name: Validate Mycel compatibility contract
        working-directory: mycel-console
        run: npm run validate:mycel-compatibility

      - name: Frontend tests
        working-directory: mycel-console
        run: npm test -- --runInBand

      - name: Frontend build
        working-directory: mycel-console
        run: npm run build

      - name: Tauri/Rust tests
        working-directory: mycel-console
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
