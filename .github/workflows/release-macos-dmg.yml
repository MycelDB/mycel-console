name: Release macOS DMGs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
            rust-target: x86_64-apple-darwin
          - arch: aarch64
            runner: macos-14
            rust-target: aarch64-apple-darwin

    steps:
      - name: Checkout Console
        uses: actions/checkout@v4
        with:
          path: mycel-console

      - name: Checkout Rust SDK at matching tag
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-rust-sdk
          ref: ${{ github.ref_name }}
          path: mycel-rust-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mycel-console/package-lock.json

      - name: Install frontend dependencies
        working-directory: mycel-console
        run: npm ci

      - name: Build DMG
        working-directory: mycel-console
        run: npm run tauri build -- --bundles dmg --target ${{ matrix.rust-target }}

      - name: Normalize release artifact name
        working-directory: mycel-console
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg_dir="src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "No DMG found under $dmg_dir" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          artifact="release-artifacts/mycel-console_${version}_${{ matrix.arch }}.dmg"
          cp "$dmg" "$artifact"
          shasum -a 256 "$artifact" > "${artifact}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycel-console-${{ matrix.arch }}-dmg
          path: |
            mycel-console/release-artifacts/*.dmg
            mycel-console/release-artifacts/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: build-macos-dmg
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mycel-console-*-dmg
          path: release-artifacts
          merge-multiple: true

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
