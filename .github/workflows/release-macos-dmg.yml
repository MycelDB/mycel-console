name: Release macOS DMGs

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  MYCEL_RUST_SDK_REF: 33c7e643b679111398dcaf8a340572cc3cce56f5

jobs:
  build-macos-dmg:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')))
    name: Build ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
          - arch: aarch64
            runner: macos-15
            rust-target: aarch64-apple-darwin

    steps:
      - name: Checkout Console
        uses: actions/checkout@v4
        with:
          path: mycel-console

      - name: Checkout Rust SDK at pinned release ref
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-rust-sdk
          ref: ${{ env.MYCEL_RUST_SDK_REF }}
          path: mycel-rust-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mycel-console/package-lock.json

      - name: Install frontend dependencies
        working-directory: mycel-console
        run: npm ci

      - name: Verify package and release versions
        working-directory: mycel-console
        run: |
          npm run validate:mycel-compatibility
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

      - name: Build DMG
        working-directory: mycel-console
        run: npm run tauri build -- --bundles dmg --target ${{ matrix.rust-target }} -- --locked

      - name: Normalize release artifact name
        working-directory: mycel-console
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dmg_dir="src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "No DMG found under $dmg_dir" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          artifact="release-artifacts/mycel-console_${version}_${{ matrix.arch }}.dmg"
          cp "$dmg" "$artifact"
          shasum -a 256 "$artifact" > "${artifact}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycel-console-${{ matrix.arch }}-dmg
          path: |
            mycel-console/release-artifacts/*.dmg
            mycel-console/release-artifacts/*.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Publish GitHub Release assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-macos-dmg
    steps:
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mycel-console-*-dmg
          path: release-artifacts
          merge-multiple: true

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
