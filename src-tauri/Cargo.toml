[package]
name = "mycel-admin"
version = "0.1.0"
description = "Desktop administration UI for Mycel clusters"
authors = ["MycelDB"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "mycel_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mycel-sdk = { path = "../../mycel-rust-sdk/crates/mycel-sdk" }
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tonic = "0.12"
